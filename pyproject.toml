[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profagent-data"
version = "0.1.0"
description = "Synthetic data contracts and fixtures for a supportive stylist agent"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
